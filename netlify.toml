[build]
  base = "web"
  # Netlify installs with the npm its image ships (10 on Node 22), and the lock is written by
  # npm 10 for that reason: a lock npm 11 writes leaves out the nested optional peers npm 10
  # expects, and npm 10's `npm ci` refuses it as out of sync (every build from 2026-10-19 to
  # 2026-10-22 failed so, and the site stayed on the build before). npm 11 installs an npm 10
  # lock as it is, so CI, which installs this same lock with npm 11, still enforces the
  # seven-day release-age hold before every push lands here
  # skip builds when nothing the site is made of changed (saves build
  # credits): the pages under web/, and this file, which carries the
  # redirect rules; the command runs in the base directory
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"
  # the lock as it is, no lifecycle script (web/.npmrc), then the build: what CI tested is what is served
  command = "npm ci --ignore-scripts && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# One address. Several hostnames answering with the same pages read, to the
# link scanners, like clones of one another: in October 2026 Google Safe
# Browsing flagged the retired domain notuspad.com and the default subdomain
# of an earlier Netlify project of this site as "social engineering", while
# notus-pad.fun stayed clean. So this project's default subdomain and the
# retired domain answer 404 with a plain page and redirect nowhere: a review
# of a flagged host then finds nothing there, instead of being sent on to
# notus-pad.fun. (Netlify may redirect a non-primary domain to the primary
# one before these rules run; keeping the retired domain off the project
# settles that.)
[[redirects]]
  from = "https://sensational-sprite-3334ea.netlify.app/*"
  to = "/retired.html"
  status = 404
  force = true

[[redirects]]
  from = "https://notuspad.com/*"
  to = "/retired.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.notuspad.com/*"
  to = "/retired.html"
  status = 404
  force = true
