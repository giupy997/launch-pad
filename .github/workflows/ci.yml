# The checks a contributor runs before a push, run on every push and pull
# request: the contracts (formatting, the unit tests; the fork tests need a
# node and stay local) and the site (npm 11 pinned, so the lock's seven-day
# release-age hold is enforced where it is installed; an immutable install
# with no lifecycle script, the registry's signatures, the production
# dependencies' advisories, types, lint, the unit tests, the production
# build, each as a script of package.json: npx with a missing binary would
# fetch the latest from the registry, a script resolves the installed one or
# fails). Every action is pinned to a commit, the token can only read.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a pull request's older run gives way to the newer push; a commit on main keeps its own status
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contracts (forge fmt, forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - run: forge --version
      - run: forge fmt --check
      - run: forge test --no-match-path "test/*.fork.t.sol"

  web:
    name: web (install, audit, types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the npm the lock is installed with: 11.21.1 (package.json's packageManager), which reads
      # min-release-age from web/.npmrc; Node 22 ships npm 10, which does not. Asserted before use
      - run: npm install -g npm@11.21.1
      - run: test "$(npm --version)" = "11.21.1" && test "$(npm config get min-release-age)" = "7"
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run typecheck:points
      - run: npm run lint
      - run: npm test
      - run: npm run build
